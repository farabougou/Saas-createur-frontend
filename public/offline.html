<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a12" />
  <title>Hors ligne — SaaS Créateurs</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0a0a12; color: #f2f2f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           text-align: center; padding: 24px; box-sizing: border-box; }
    .box { max-width: 360px; }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #9797a8; line-height: 1.5; margin: 0 0 22px; }
    button { background: #6366f1; color: #fff; border: none; border-radius: 12px; padding: 14px 24px;
             font-size: 16px; font-weight: 600; min-height: 48px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>SaaS Créateurs a besoin d'une connexion Internet pour charger vos données. Vérifiez votre réseau, puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
